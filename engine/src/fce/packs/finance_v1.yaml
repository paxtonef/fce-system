pack_id: finance_v1
domain: finance
thresholds:
  unstable_max: 0.35
  stable_max: 0.75
metric_thresholds:
  cash_months:
    critical_max: 1.0
    warning_max: 3.0
    weight: 0.35
  debt_ratio:
    critical_min: 0.5
    warning_min: 0.3
    weight: 0.30
  stress_level:
    critical_min: 7
    warning_min: 5
    weight: 0.35
constraints:
  - id: C001
    condition: debt_ratio > 0.5
    action: block
    hard: true
  - id: C002
    condition: income < 2000
    action: block
actions:
  - id: A001
    risk_level: high
  - id: A002
    risk_level: low
    priority: true
  - id: A003
    risk_level: medium
