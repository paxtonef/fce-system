pack_id: "career_v1"
domain: "career"
metric_thresholds:
  years_experience:
    weight: 0.20
    warning_max: 3
    critical_max: 1
  current_income:
    weight: 0.15
    warning_max: 40000
    critical_max: 25000
  market_demand_score:
    weight: 0.30
    warning_max: 5
    critical_max: 3
  skill_gaps:
    weight: 0.25
    warning_min: 2
    critical_min: 5
  network_strength:
    weight: 0.10
    warning_max: 4
    critical_max: 2
thresholds:
  unstable_max: 0.35
  stable_max: 0.75
constraints:
  - id: "C001"
    condition: "skill_gaps > 3"
    action: "block"
    hard: false
  - id: "C002"
    condition: "market_demand_score < 4"
    action: "review"
    hard: false
  - id: "C003"
    condition: "years_experience < 2"
    action: "caution"
    hard: false
  - id: "C004"
    condition: "network_strength < 3"
    action: "review"
    hard: false
actions:
  - id: "A001"
    name: "role_promotion"
    risk_level: "high"
    priority: false
  - id: "A002"
    name: "skill_training"
    risk_level: "medium"
    priority: true
  - id: "A003"
    name: "network_building"
    risk_level: "low"
    priority: false
  - id: "A004"
    name: "job_search"
    risk_level: "medium"
    priority: false
