pack_id: "health_v1"
domain: "health"
metric_thresholds:
  age:
    weight: 0.20
    warning_min: 55
    critical_min: 70
  bmi:
    weight: 0.25
    warning_min: 28
    critical_min: 35
  resting_hr:
    weight: 0.20
    warning_min: 90
    critical_min: 110
  symptom_count:
    weight: 0.25
    warning_min: 2
    critical_min: 5
  chronic_conditions:
    weight: 0.10
    warning_min: 2
    critical_min: 4
thresholds:
  unstable_max: 0.35
  stable_max: 0.75
constraints:
  - id: "C001"
    condition: "bmi > 30"
    action: "review"
    hard: false
  - id: "C002"
    condition: "age > 65"
    action: "caution"
    hard: false
  - id: "C003"
    condition: "symptom_count > 3"
    action: "block"
    hard: false
  - id: "C004"
    condition: "resting_hr > 100"
    action: "review"
    hard: false
  - id: "C005"
    condition: "chronic_conditions > 2"
    action: "caution"
    hard: false
actions:
  - id: "A001"
    name: "specialist_referral"
    risk_level: "high"
    priority: false
  - id: "A002"
    name: "lifestyle_program"
    risk_level: "medium"
    priority: true
  - id: "A003"
    name: "routine_monitoring"
    risk_level: "low"
    priority: false
  - id: "A004"
    name: "preventive_screening"
    risk_level: "low"
    priority: false
